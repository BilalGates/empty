name: Release policy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/audit-release.mjs
