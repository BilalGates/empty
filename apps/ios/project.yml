name: Empty
options:
  bundleIdPrefix: com.empty
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Clibsodium:
    url: https://github.com/jedisct1/swift-sodium.git
    revision: cfd195c76882aa9b997560ca7cb95d72fbf5db00
  Argon2Reference:
    url: https://github.com/P-H-C/phc-winner-argon2.git
    revision: f57e61e19229e23c4445b85494dbf7c07de721cb
targets:
  EmptyShared:
    type: framework
    platform: iOS
    sources: [Sources/EmptyShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empty.shared
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Clibsodium
        product: Clibsodium
      - package: Argon2Reference
        product: argon2
  Empty:
    type: application
    platform: iOS
    sources: [Sources/EmptyApp]
    info:
      path: Configuration/Empty-Info.plist
      properties:
        CFBundleDisplayName: Empty
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock your encrypted Empty vault.
        EmptyKeychainAccessGroup: "$(AppIdentifierPrefix)com.empty.shared"
        EmptyAppGroup: group.com.empty.shared
    entitlements:
      path: Configuration/Empty.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.empty.shared]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.empty.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empty.app
    dependencies:
      - target: EmptyShared
      - target: EmptyCredentialProvider
        embed: true
  EmptyCredentialProvider:
    type: app-extension
    platform: iOS
    sources: [Sources/CredentialProvider]
    info:
      path: Configuration/CredentialProvider-Info.plist
      properties:
        CFBundleDisplayName: Empty AutoFill
        NSFaceIDUsageDescription: Unlock a credential selected for AutoFill.
        EmptyKeychainAccessGroup: "$(AppIdentifierPrefix)com.empty.shared"
        EmptyAppGroup: group.com.empty.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).CredentialProviderViewController"
    entitlements:
      path: Configuration/CredentialProvider.entitlements
      properties:
        com.apple.developer.authentication-services.autofill-credential-provider: true
        com.apple.security.application-groups: [group.com.empty.shared]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.empty.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empty.app.credential-provider
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: EmptyShared
  EmptySharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EmptySharedTests
      - path: ../../test-vectors
        buildPhase: resources
    dependencies:
      - target: EmptyShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CredentialProviderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CredentialProviderTests]
    dependencies:
      - target: EmptyShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Empty:
    build:
      targets:
        Empty: all
        EmptyCredentialProvider: all
        EmptySharedTests: [test]
        CredentialProviderTests: [test]
    test:
      targets:
        - EmptySharedTests
        - CredentialProviderTests
