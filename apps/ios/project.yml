name: Space
options:
  bundleIdPrefix: com.space
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  Clibsodium:
    url: https://github.com/jedisct1/swift-sodium.git
    revision: cfd195c76882aa9b997560ca7cb95d72fbf5db00
  Argon2Reference:
    url: https://github.com/P-H-C/phc-winner-argon2.git
    revision: f57e61e19229e23c4445b85494dbf7c07de721cb
targets:
  SpaceShared:
    type: framework
    platform: iOS
    sources: [Sources/SpaceShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.space.shared
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: Clibsodium
        product: Clibsodium
      - package: Argon2Reference
        product: argon2
  Space:
    type: application
    platform: iOS
    sources: [Sources/SpaceApp]
    info:
      path: Configuration/Space-Info.plist
      properties:
        CFBundleDisplayName: Space
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock your encrypted Space vault.
        SpaceKeychainAccessGroup: "$(AppIdentifierPrefix)com.space.shared"
    entitlements:
      path: Configuration/Space.entitlements
    dependencies:
      - target: SpaceShared
      - target: SpaceCredentialProvider
        embed: true
  SpaceCredentialProvider:
    type: app-extension
    platform: iOS
    sources: [Sources/CredentialProvider]
    info:
      path: Configuration/CredentialProvider-Info.plist
      properties:
        CFBundleDisplayName: Space AutoFill
        NSFaceIDUsageDescription: Unlock a credential selected for AutoFill.
        SpaceKeychainAccessGroup: "$(AppIdentifierPrefix)com.space.shared"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).CredentialProviderViewController"
    entitlements:
      path: Configuration/CredentialProvider.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.space.credential-provider
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: SpaceShared
  SpaceSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SpaceSharedTests
      - path: ../../test-vectors
        buildPhase: resources
    dependencies:
      - target: SpaceShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CredentialProviderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CredentialProviderTests]
    dependencies:
      - target: SpaceCredentialProvider
      - target: SpaceShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Space:
    build:
      targets:
        Space: all
        SpaceCredentialProvider: all
        SpaceSharedTests: [test]
        CredentialProviderTests: [test]
    test:
      targets:
        - SpaceSharedTests
        - CredentialProviderTests
