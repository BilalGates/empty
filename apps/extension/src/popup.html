<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><h1>Space</h1><span id="origin"></span></header>
    <section id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Checking this page…</section>
    <section id="content" hidden></section>
    <details id="generator">
      <summary>Generate password</summary>
      <div class="generator-row">
        <output id="generated" aria-label="Generated password">••••••••••••••••••••</output>
        <button id="regenerate" class="secondary" type="button">Generate another</button>
      </div>
      <button id="fill-generated" type="button">Fill generated password</button>
    </details>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
